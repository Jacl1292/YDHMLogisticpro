services:
  postgres:
    image: postgres:16
    container_name: ydhm-logistics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ydhm_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ydhm_postgres_data:/var/lib/postgresql/data

volumes:
  ydhm_postgres_data:
